<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portfolio Builder AI</title><style>body{font-family:Arial;background:#081226;color:#e6eef8;padding:20px}input,button{padding:8px;margin:6px}</style></head>
<body><h1>Portfolio Builder AI (Demo)</h1>
<input id="name" placeholder="Your name"><button onclick="generate()">Generate Portfolio</button>
<div id="result"></div>
<script>
async function generate(){
  const name = document.getElementById('name').value;
  const res = await fetch('http://localhost:5000/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  const data = await res.json();
  document.getElementById('result').innerHTML = '<h2>'+data.title+'</h2><p>'+data.about+'</p>';
}
</script></body></html>
